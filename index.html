<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Seru TK A</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#56ccf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Belajar TK A">
<link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root {
  --sky1: #4facfe;
  --sky2: #b6fbff;
  --card: #ffffff;
  --ink: #34285c;
  --grass1: #8ce99a;
  --grass2: #51cf66;
  --ok: #2bb673;
  --no: #ff6b6b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky1: #161842;
    --sky2: #2f327d;
    --card: #2c2759;
    --ink: #fff6db;
    --grass1: #2b8a57;
    --grass2: #1f6b43;
  }
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  font-family: "Fredoka", "Comic Sans MS", system-ui, sans-serif;
  font-weight: 600;
  overflow-x: hidden;
}

body {
  background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 78%);
  background-attachment: fixed;
  min-height: 100vh;
}

.arab {
  font-family: "Noto Naskh Arabic", "Traditional Arabic", serif;
  line-height: 1.35;
}

/* ====== DEKORASI LATAR BELAKANG ====== */
.scenery {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.sun {
  position: absolute;
  top: 22px;
  right: 22px;
  width: 78px;
  height: 78px;
  animation: spinSlow 28s linear infinite;
}

@keyframes spinSlow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.hill-back {
  position: absolute;
  left: -15%;
  right: -15%;
  bottom: 42px;
  height: 155px;
  background: var(--grass1);
  border-radius: 55% 45% 0 0 / 85px 75px 0 0;
}

.hill-front {
  position: absolute;
  left: -10%;
  right: -10%;
  bottom: -25px;
  height: 130px;
  background: var(--grass2);
  border-radius: 45% 55% 0 0 / 65px 80px 0 0;
  box-shadow: inset 0 10px 0 rgba(255,255,255,0.28);
}

.rainbow {
  position: absolute;
  top: 48px;
  left: -60px;
  width: 340px;
  height: 170px;
  opacity: 0.45;
  transform: rotate(-12deg);
}

.balloon {
  position: absolute;
  top: 15%;
  right: 12%;
  width: 56px;
  animation: floatBalloon 7s ease-in-out infinite;
}

@keyframes floatBalloon {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-18px) rotate(4deg); }
}

.landscape-props {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 165px;
  pointer-events: none;
}

.fence-strip {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  height: 34px;
  background-image: repeating-linear-gradient(
    90deg,
    #fff3e0 0px,
    #fff3e0 14px,
    #e6ccb2 14px,
    #e6ccb2 18px,
    transparent 18px,
    transparent 34px
  );
  opacity: 0.85;
}

.fence-rail {
  position: absolute;
  bottom: 28px;
  left: 0;
  right: 0;
  height: 8px;
  background: #f5ebe0;
  box-shadow: 0 3px 0 rgba(0,0,0,0.12);
}

.flowers-deco {
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 12px;
  font-size: 32px;
}

.cloud {
  position: absolute;
  opacity: 0.92;
  animation: drift 42s linear infinite;
}
.cloud.c1 { top: 7%; width: 110px; }
.cloud.c2 { top: 20%; width: 85px; animation-duration: 58s; animation-delay: -22s; }
.cloud.c3 { top: 34%; width: 70px; animation-duration: 48s; animation-delay: -10s; opacity: 0.65; }

@keyframes drift {
  from { transform: translateX(-140px); }
  to { transform: translateX(calc(100vw + 140px)); }
}

.helicopter {
  position: absolute;
  top: 28%;
  width: 92px;
  animation: flyHeli 22s linear infinite;
}

.heli-rotor {
  transform-origin: 48px 14px;
  animation: spinRotor 0.14s linear infinite;
}

@keyframes spinRotor {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.15); }
}

@keyframes flyHeli {
  0% { transform: translate(-120px, 0px) rotate(4deg); }
  25% { transform: translate(28vw, -14px) rotate(2deg); }
  50% { transform: translate(60vw, 6px) rotate(5deg); }
  75% { transform: translate(92vw, -10px) rotate(2deg); }
  100% { transform: translate(calc(100vw + 120px), 0px) rotate(4deg); }
}

/* ====== KONTEN UTAMA ====== */
main {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 14px 16px 120px;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}

/* ====== MASKOT BURUNG HANTU SVG ====== */
.mascot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 2px 0 6px;
}

.speech-bubble {
  background: #ffffff;
  color: #34285c;
  padding: 6px 16px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  margin-bottom: 6px;
  position: relative;
  animation: bob 3s ease-in-out infinite;
}

.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -7px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 8px 8px 0;
  border-style: solid;
  border-color: #ffffff transparent transparent;
}

.owl-svg {
  width: 96px;
  height: 96px;
  filter: drop-shadow(0 6px 0 rgba(0,0,0,0.16));
  animation: owlIdle 2.6s ease-in-out infinite;
  cursor: pointer;
  transition: transform 0.2s;
}

.owl-svg:active {
  transform: scale(0.92);
}

.owl-svg.talking {
  animation: owlTalk 0.45s ease-in-out infinite alternate;
}

.owl-svg.happy {
  animation: owlJump 0.6s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
}

@keyframes owlIdle {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(-3deg); }
}

@keyframes owlTalk {
  0% { transform: scale(1) rotate(-3deg); }
  100% { transform: scale(1.07) rotate(3deg); }
}

@keyframes owlJump {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-16px) scale(1.1); }
}

/* ====== HEADER & TAB ====== */
.logo {
  text-align: center;
  margin-bottom: 6px;
}

.logo h1 {
  margin: 0;
  font-size: 36px;
  line-height: 1.08;
  color: #fff;
  text-shadow: 0 4px 0 #2b5885, 0 8px 16px rgba(0,0,0,0.22);
  letter-spacing: 0.5px;
}

.logo .badge {
  margin: 8px 0 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #ffcf33;
  color: #4a3200;
  padding: 5px 16px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 3px 0 #d9a400;
}

.tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 14px;
}

.tab {
  background: rgba(255,255,255,0.88);
  color: #34285c;
  border-radius: 99px;
  padding: 10px 16px;
  font-size: 15px;
  font-weight: 700;
  box-shadow: 0 5px 0 rgba(0,0,0,0.18);
  transition: transform 0.12s, background 0.2s;
}

.tab:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.18);
}

.tab.on {
  background: linear-gradient(180deg, #ff926b 0%, #ff6b4a 100%);
  color: #fff;
  box-shadow: 0 5px 0 #c24125;
  text-shadow: 0 2px 0 rgba(0,0,0,0.2);
}

/* ====== KARTU TOPIK ====== */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 18px;
}

.topic {
  position: relative;
  border-radius: 30px;
  padding: 22px 12px 18px;
  text-align: center;
  color: #fff;
  background: linear-gradient(155deg, var(--c) 0%, var(--d) 100%);
  box-shadow: 0 8px 0 var(--d), 0 14px 24px rgba(0,0,0,0.24);
  border: 4px solid rgba(255,255,255,0.45);
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}

.topic:nth-child(odd) { transform: rotate(-1.5deg); }
.topic:nth-child(even) { transform: rotate(1.5deg); }

.topic::before {
  content: '';
  position: absolute;
  top: -24px;
  right: -24px;
  width: 85px;
  height: 85px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
}

.topic::after {
  content: '';
  position: absolute;
  top: 6px;
  left: 14px;
  right: 14px;
  height: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
  border-radius: 99px;
}

.topic:active {
  transform: translateY(6px) scale(0.97) rotate(0deg);
  box-shadow: 0 2px 0 var(--d);
}

.topic-tag {
  display: inline-block;
  background: rgba(0,0,0,0.2);
  padding: 2px 10px;
  border-radius: 99px;
  font-size: 11px;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
}

.topic .ic {
  display: block;
  font-size: 66px;
  filter: drop-shadow(0 6px 0 rgba(0,0,0,0.22));
  animation: bob 3s ease-in-out infinite;
}

@keyframes bob {
  50% { transform: translateY(-7px) rotate(-4deg); }
}

.topic:nth-child(2) .ic { animation-delay: -0.7s; }
.topic:nth-child(3) .ic { animation-delay: -1.4s; }
.topic:nth-child(4) .ic { animation-delay: -2s; }

.topic b {
  display: block;
  font-size: 18px;
  margin-top: 6px;
  line-height: 1.18;
  text-shadow: 0 2px 0 rgba(0,0,0,0.22);
}

.topic small {
  display: block;
  font-size: 12px;
  opacity: 0.92;
  margin-top: 3px;
}

/* ====== HALAMAN KUIS ====== */
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.back {
  background: #fff;
  color: #34285c;
  border-radius: 20px;
  width: 54px;
  height: 54px;
  font-size: 26px;
  box-shadow: 0 5px 0 rgba(0,0,0,0.2);
  transition: transform 0.1s;
}

.back:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.2);
}

.dots {
  flex: 1;
  display: flex;
  gap: 5px;
  justify-content: center;
  background: rgba(255,255,255,0.88);
  border-radius: 99px;
  padding: 8px 10px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.12);
}

.dots i {
  font-style: normal;
  font-size: 20px;
  filter: grayscale(1);
  opacity: 0.32;
  transition: transform 0.3s;
}

.dots i.on {
  filter: none;
  opacity: 1;
  animation: pop 0.45s;
}

@keyframes pop {
  50% { transform: scale(1.65) rotate(22deg); }
}

.q {
  background: var(--card);
  border-radius: 34px;
  padding: 18px 16px;
  text-align: center;
  border: 6px solid var(--c);
  box-shadow: 0 9px 0 var(--d), 0 16px 26px rgba(0,0,0,0.2);
  animation: cardEnter 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes cardEnter {
  from { opacity: 0; transform: scale(0.92) translateY(14px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.q-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 10px;
}

.show {
  font-size: 56px;
  line-height: 1.2;
  min-height: 152px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: center;
  word-break: break-word;
  border-radius: 24px;
  background: color-mix(in srgb, var(--c) 15%, var(--card));
  border: 3px dashed color-mix(in srgb, var(--c) 45%, transparent);
  padding: 14px;
}

.show span {
  display: inline-block;
  animation: bob 2.6s ease-in-out infinite;
}
.show span:nth-child(2n) { animation-delay: -0.8s; }
.show span:nth-child(3n) { animation-delay: -1.5s; }

.big {
  font-size: 98px;
  filter: drop-shadow(0 6px 0 rgba(0,0,0,0.12));
}

.big.arab {
  font-size: 104px;
}

/* ====== TOMBOL SUARA ====== */
.say {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 14px auto;
  background: linear-gradient(180deg, #ffe066 0%, #fcc419 100%);
  color: #4a3200;
  border-radius: 99px;
  padding: 8px 20px 8px 12px;
  box-shadow: 0 5px 0 #d99b00;
  font-size: 17px;
  font-weight: 700;
  transition: transform 0.12s;
}

.say:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #d99b00;
}

.say.speaking {
  background: linear-gradient(180deg, #69db7c 0%, #37b24d 100%);
  color: #fff;
  box-shadow: 0 5px 0 #2b8a3e;
}

.say .wave {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 18px;
}

.say .wave i {
  display: block;
  width: 4px;
  height: 8px;
  background: currentColor;
  border-radius: 4px;
}

.say.speaking .wave i {
  animation: eq 0.5s ease-in-out infinite alternate;
}
.say.speaking .wave i:nth-child(2) { animation-delay: 0.15s; }
.say.speaking .wave i:nth-child(3) { animation-delay: 0.3s; }

@keyframes eq {
  from { height: 6px; }
  to { height: 18px; }
}

/* ====== PILIHAN JAWABAN ====== */
.opts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.opt {
  border-radius: 26px;
  font-size: 52px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  padding: 14px 4px;
  min-height: 106px;
  background: var(--b);
  box-shadow: 0 7px 0 var(--bd);
  border: 3px solid rgba(255,255,255,0.3);
  transition: transform 0.1s;
}

.opt.arab-opt {
  font-family: "Noto Naskh Arabic", "Traditional Arabic", serif;
  font-size: 58px;
  line-height: 1.25;
}

.opt.txt-opt {
  font-size: 26px;
}

.opt:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 var(--bd);
}

.opt:nth-child(1) { --b: #ff6b6b; --bd: #c94545; }
.opt:nth-child(2) { --b: #339af0; --bd: #1c7ed6; }
.opt:nth-child(3) { --b: #fcc419; --bd: #d99b00; }

.opt.good {
  --b: #2bb673;
  --bd: #1b8553;
  transform: scale(1.08);
}

.opt.bad {
  --b: #adb5bd;
  --bd: #868e96;
  animation: sh 0.38s;
}

@keyframes sh {
  25% { transform: translateX(-9px) rotate(-3deg); }
  75% { transform: translateX(9px) rotate(3deg); }
}

/* ====== CANVAS MENEBALKAN ====== */
.opts2 {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 8px 0 4px;
}

#cv {
  width: 100%;
  max-width: 310px;
  aspect-ratio: 1;
  touch-action: none;
  border-radius: 22px;
  background: #fffdf7;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.08);
}

/* ====== LAYAR SELESAI ====== */
.end {
  text-align: center;
  background: var(--card);
  border-radius: 34px;
  padding: 26px 18px;
  border: 6px solid #ffcf33;
  box-shadow: 0 9px 0 #d9a400, 0 16px 26px rgba(0,0,0,0.22);
  animation: cardEnter 0.4s ease-out;
}

.end h1 {
  margin: 6px 0;
  font-size: 36px;
}

.stars {
  font-size: 62px;
  margin: 8px 0;
}

.stars span {
  display: inline-block;
  animation: pop 0.7s both;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,0.15));
}

.stars span:nth-child(2) { animation-delay: 0.25s; }
.stars span:nth-child(3) { animation-delay: 0.5s; }

.btn {
  background: linear-gradient(180deg, #ff926b 0%, #ff6b4a 100%);
  color: #fff;
  border-radius: 24px;
  padding: 14px 24px;
  font-size: 20px;
  font-weight: 700;
  margin: 6px;
  box-shadow: 0 5px 0 #c24125;
  text-shadow: 0 2px 0 rgba(0,0,0,0.2);
  transition: transform 0.1s;
}

.btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #c24125;
}

.btn.g {
  background: #f1f3f5;
  color: #34285c;
  box-shadow: 0 5px 0 #ced4da;
  text-shadow: none;
}

.btn.g:active {
  box-shadow: 0 1px 0 #ced4da;
}

.fx {
  position: fixed;
  z-index: 99;
  pointer-events: none;
  font-size: 32px;
  animation: fly 1.25s ease-out forwards;
}

@keyframes fly {
  to {
    transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1.2);
    opacity: 0;
  }
}

.status-pill {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 14px;
  border-radius: 99px;
  background: rgba(255,255,255,0.88);
  color: #34285c;
  font-size: 13px;
  box-shadow: 0 3px 0 rgba(0,0,0,0.12);
}
</style>
</head>
<body>

async function initAudio() {
  if (!audioReady && window.Tone) {

      audioReady = true;
    } catch (e) {}
  }
}

function playSfx(type) {
  initAudio();
  if (!window.Tone) return;
  try {
    const synth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'triangle' },
      envelope: { attack: 0.01, decay: 0.15, sustain: 0.05, release: 0.2 }
    }).toDestination();
    synth.volume.value = -8;
    const now = Tone.now();
    if (type === 'pop') {
      synth.triggerAttackRelease('C5', '32n', now);
    } else if (type === 'win') {
      synth.triggerAttackRelease('C5', '16n', now);
      synth.triggerAttackRelease('E5', '16n', now + 0.09);
      synth.triggerAttackRelease('G5', '16n', now + 0.18);
      synth.triggerAttackRelease('C6', '8n', now + 0.27);
    } else if (type === 'wrong') {
      synth.triggerAttackRelease('E4', '16n', now);
      synth.triggerAttackRelease('C4', '8n', now + 0.12);
    } else if (type === 'fanfare') {
      ['C5', 'E5', 'G5', 'B5', 'C6'].forEach((n, i) => {
        synth.triggerAttackRelease(n, '16n', now + i * 0.1);
      });
    }
  } catch (e) {}
}

function fallbackBrowserSay(text, onDone) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID';
    u.rate = 0.88;
    const v = speechSynthesis.getVoices().find(x => /^id[-_]/i.test(x.lang));
    if (v) u.voice = v;
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      if (onDone) onDone();
    };
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
    setTimeout(finish, 4000);
  } catch (e) {
    if (onDone) setTimeout(onDone, 1200);
  }
}

function setSpeakingUI(active) {
  const btn = $('.say');
  const owl = $('.owl-svg');
  if (btn) btn.classList.toggle('speaking', active);
  if (owl) owl.classList.toggle('talking', active);
}

function stopSpeech() {
  speakReqId++;
  try {
    SHARED_AUDIO.pause();
    SHARED_AUDIO.onended = null;
    SHARED_AUDIO.onerror = null;
  } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  setSpeakingUI(false);
}

function playSingleClip(id, myId) {
  return new Promise((resolve) => {
    if (myId !== speakReqId) return resolve(false);
    let settled = false;
    const finish = (ok) => {
      if (settled) return;
      settled = true;
      resolve(ok);
    };

    let mp3Tried = false;
    const tryMp3 = () => {
      if (mp3Tried || settled || myId !== speakReqId) return finish(false);
      mp3Tried = true;
      SHARED_AUDIO.src = `audio/${id}.mp3`;
      SHARED_AUDIO.onended = () => finish(true);
      SHARED_AUDIO.onerror = () => finish(false);
      SHARED_AUDIO.play().catch(() => finish(false));
    };

    SHARED_AUDIO.src = `audio/${id}.wav`;
    SHARED_AUDIO.onended = () => finish(true);
    SHARED_AUDIO.onerror = tryMp3;
    SHARED_AUDIO.play().catch(tryMp3);
  });
}

async function saySeq(ids, onDone = null) {
  const list = Array.isArray(ids) ? ids : [ids];
  unlockSharedAudio();
  stopSpeech();
  const myId = ++speakReqId;
  setSpeakingUI(true);

  let allPlayed = true;
  for (let idx = 0; idx < list.length; idx++) {
    if (myId !== speakReqId) return;
    if (idx > 0) {
      await new Promise(r => setTimeout(r, 65));
      if (myId !== speakReqId) return;
    }
    const ok = await playSingleClip(list[idx], myId);
    if (!ok) {
      allPlayed = false;
      break;
    }
  }

  if (myId !== speakReqId) return;

  if (allPlayed) {
    setSpeakingUI(false);
    if (onDone) setTimeout(onDone, 360);
  } else {
    const fallbackText = list.map(id => VOICE_LINES[id] || id).join(' ');
    fallbackBrowserSay(fallbackText, () => {
      if (myId !== speakReqId) return;
      setSpeakingUI(false);
      if (onDone) setTimeout(onDone, 360);
    });
  }
}

function sayThen(ids, cb) {

function opts3(correct, universe, cls = '') {
  const wrong = shuf(universe.filter(x => x !== correct)).slice(0, 2);
  return shuf([correct, ...wrong]).map(v => ({ h: String(v), v, cls }));
}

function pickUnique(arr, used, prefix) {
  const unused = arr.filter(item => {
    const key = Array.isArray(item) ? item[1] : (typeof item === 'object' ? (item.ch || item.glyph) : item);
    return !used.has(prefix + ':' + key);
  });
  const chosen = unused.length ? pick(unused) : pick(arr);
  const key = Array.isArray(chosen) ? chosen[1] : (typeof chosen === 'object' ? (chosen.ch || chosen.glyph) : chosen);
  used.add(prefix + ':' + key);
  return chosen;
}

    let n = 1 + rnd(5), e = pick(t.pool);
    for (let k = 0; k < 10; k++) {
      n = 1 + rnd(5);
      e = pick(t.pool);
      if (!used.has(`count:${n}:${e}`)) break;
    }
    used.add(`count:${n}:${e}`);
    return {

      sayIds: ['q_count'],
      show: e.repeat(n),
      opts: opts3(n, [1,2,3,4,5]),
      ans: n,
      winIds: ['ada', `num_${n}`]
    };
  },
  missing(t, used) {
    const k = pickUnique([0,1,2,3,4], used, 'missing');
    const seq = [1,2,3,4,5];
    return {
      text: 'Angka berapa yang hilang?',
      sayIds: ['q_missing'],
      show: seq.map((x,i) => i === k ? '❓' : x).join(' '),
      opts: opts3(seq[k], [1,2,3,4,5]),
      ans: seq[k],
      winIds: ['angka', `num_${seq[k]}`]
    };
  },
  vokal(t, used) {
    const V = ['A','I','U','E','O'], C = ['B','K','M','S','T','L','P'];
    const a = pickUnique(V, used, 'vokal');
    return {
      text: 'Mana yang huruf vokal?',
      sayIds: ['q_vokal'],
      show: '🔤',
      opts: shuf([a, ...shuf(C).slice(0,2)]).map(v => ({ h: v, v })),
      ans: a,
      winIds: ['huruf', `let_${a}`]
    };
  },
  initial(t, used) {
    const list = WORDS.filter(w => t.words.includes(w[1]));
    const w = pickUnique(list, used, 'initial');
    const L = [...new Set(WORDS.map(x => x[2]))];
    return {
      text: `${w[1]}. ${w[1]} dimulai dari huruf apa?`,
      sayIds: [`w_${w[1]}`, 'q_initial'],
      show: `<span class="big">${w[0]}</span>`,
      opts: opts3(w[2], L),
      ans: w[2],
      winIds: [`w_${w[1]}`, 'dimulai_huruf', `let_${w[2]}`]
    };
  },
  tambah(t, used) {
    let a = 1 + rnd(3), b = 1 + rnd(Math.min(3, 5 - a)), e = pick(t.pool);
    for (let k = 0; k < 10; k++) {
      a = 1 + rnd(3);
      b = 1 + rnd(Math.min(3, 5 - a));
      if (!used.has(`tambah:${a}+${b}`)) break;
    }
    used.add(`tambah:${a}+${b}`);
    return {
      text: 'Berapa jumlah semuanya?',
      sayIds: ['q_tambah'],
      show: e.repeat(a) + ' ➕ ' + e.repeat(b),
      opts: opts3(a + b, [1,2,3,4,5]),
      ans: a + b,
      winIds: [`num_${a}`, 'tambah', `num_${b}`, 'sama_dengan', `num_${a + b}`]
    };
  },
  kurang(t, used) {
    let a = 2 + rnd(4), b = 1 + rnd(a - 1), e = pick(t.pool);
    for (let k = 0; k < 10; k++) {
      a = 2 + rnd(4);
      b = 1 + rnd(a - 1);
      if (!used.has(`kurang:${a}-${b}`)) break;
    }
    used.add(`kurang:${a}-${b}`);
    return {
      text: 'Berapa sisanya sekarang?',
      sayIds: ['q_kurang'],
      show: e.repeat(a) + ' ➖ ' + e.repeat(b),
      opts: opts3(a - b, [1,2,3,4,5]),
      ans: a - b,
      winIds: [`num_${a}`, 'kurang', `num_${b}`, 'sisa', `num_${a - b}`]
    };
  },
  tulis(t, used) {
    const c = pickUnique(t.trace, used, 'tulis'), isNum = /\d/.test(c);
    return {
      text: `Ayo tebalkan ${isNum ? 'angka' : 'huruf'} ${c}`,
      sayIds: [isNum ? 'q_tulis_angka' : 'q_tulis_huruf', isNum ? `num_${c}` : `let_${c}`],
      trace: c,
      ans: c,
      winIds: [isNum ? 'hebat_ini_angka' : 'hebat_ini_huruf', isNum ? `num_${c}` : `let_${c}`]
    };
  },
  emo(t, used) {
    const e = pickUnique(EMO, used, 'emo');
    return {
      text: `Mana wajah yang ${e[1]}?`,
      sayIds: ['q_emo', `emo_${e[1]}`],
      show: '🙂',
      opts: opts3(e[0], EMO.map(x => x[0])),
      ans: e[0],
      winIds: ['ini_wajah', `emo_${e[1]}`]
    };
  },
  hij_tebak(t, used) {
    const item = pickUnique(HIJAIYAH, used, 'hij_tebak');
    return {
      text: `Mana huruf hijaiyah "${item.name}"?`,
      sayIds: ['q_hijaiyah', item.id],
      show: `<span style="font-size:38px;font-weight:700">${item.name}</span>`,
      opts: opts3(item.ch, HIJAIYAH.map(x => x.ch), 'arab-opt'),
      ans: item.ch,
      winIds: ['hebat_ini_hijaiyah', item.id]
    };
  },
  hij_tulis(t, used) {
    const item = pickUnique(HIJAIYAH, used, 'hij_tulis');
    return {
      text: `Ayo tebalkan huruf hijaiyah "${item.name}"`,
      sayIds: ['q_tulis_hijaiyah', item.id],
      trace: item.ch,
      isArab: true,
      ans: item.ch,
      winIds: ['hebat_ini_hijaiyah', item.id]
    };
  },
  har_baca(t, used) {
    const card = pickUnique(HARAKAT_CARDS, used, 'har_baca');
    const sameBase = HARAKAT_CARDS.filter(x => x.glyph[0] === card.glyph[0] && x.read !== card.read).map(x => x.read);
    const wrong = shuf(sameBase).slice(0, 2);
    return {
      text: 'Bagaimana cara membaca huruf ini?',
      sayIds: ['q_harakat_bunyi'],
      show: `<span class="big arab">${card.glyph}</span>`,
      opts: shuf([card.read, ...wrong]).map(v => ({ h: v.toUpperCase(), v, cls: 'txt-opt' })),
      ans: card.read,
      winIds: ['bacaannya', card.sylId]
    };
  },
  har_jenis(t, used) {
    const card = pickUnique(HARAKAT_CARDS, used, 'har_jenis');
    return {
      text: 'Tanda baca apakah yang ada di huruf ini?',
      sayIds: ['q_harakat_jenis'],
      show: `<span class="big arab">${card.glyph}</span>`,
      opts: opts3(card.harName, ['Fathah', 'Kasrah', 'Dhomah'], 'txt-opt'),
      ans: card.harName,
      winIds: [card.harId]
    };
  }
};

function build(t) {
  const used = new Set();
  return t.types.map(k => GEN[k](t, used));
}

/* ====== TAMPILAN MENU & KUIS ====== */
function home() {
  S = null;
  stopSpeech();
  $('#app').style.cssText = '';
  $('#app').innerHTML = `
    <div class="logo">
      <div class="mascot-wrap">
        <div class="speech-bubble">Halo! Pilih petualanganmu yuk! 🎒</div>
        ${owlSVG()}
      </div>
      <h1>Belajar Seru<br>TK A</h1>
      <div class="badge">✨ Sentra Readiness ✨</div>
    </div>
    <div class="tabs">
      <button class="tab ${SEM === 1 ? 'on' : ''}" onclick="setSem(1)">Semester 1</button>
      <button class="tab ${SEM === 2 ? 'on' : ''}" onclick="setSem(2)">Semester 2</button>
      <button class="tab ${SEM === 3 ? 'on' : ''}" onclick="setSem(3)">🕌 Al-Qur'an</button>
    </div>
    <div class="grid">
      ${TOPICS.map((t, i) => t.sem !== SEM ? '' : `
        <button class="topic" style="--c:${t.c};--d:${t.d}" onclick="start(${i})">
          <span class="topic-tag">${t.tag}</span>
          <span class="ic">${t.ic}</span>
          <b>${t.n}</b>
          <small>${t.s}</small>
        </button>`).join('')}
    </div>`;
  if (!welcomePlayed) {
    setTimeout(tryAutoWelcome, 350);
  }
}

function start(i) {
  welcomePlayed = true;
  unlockSharedAudio();
  playSfx('pop');
  const qs = build(TOPICS[i]);
  S = { t: i, qs, i: 0, ok: 0, first: true };
  ask();
}

function ask() {
  const q = S.qs[S.i];
  S.first = true;
  S.lock = false;
  const T = TOPICS[S.t];
  $('#app').style.cssText = `--c:${T.c};--d:${T.d}`;

  const sp = h => {
    if (h.includes('<')) return h;
    const g = window.Intl && Intl.Segmenter
      ? [...new Intl.Segmenter().segment(h)].map(x => x.segment)
      : [...h];
    return g.map(c => c === ' ' ? ' ' : `<span>${c}</span>`).join('');
  };

  $('#app').innerHTML = `
    <div class="top">
      <button class="back" onclick="playSfx('pop');home()" aria-label="Menu">🏠</button>
      <div class="dots">${S.qs.map((_, k) => `<i class="${k < S.i ? 'on' : ''}">⭐</i>`).join('')}</div>
    </div>
    <div class="q">
      <div class="q-title">${q.text}</div>
      <div class="show"${q.trace ? ' style="min-height:0;padding:8px"' : ''}>
        ${q.trace ? '<canvas id="cv" width="320" height="320"></canvas>' : sp(q.show)}
      </div>
      <button class="say" onclick="saySeq(S.qs[S.i].sayIds)" aria-label="Dengar soal">
        <span>🦉</span>
        <span>Dengar lagi</span>
        <span class="wave"><i></i><i></i><i></i></span>
      </button>
      ${q.trace ? `
        <div class="opts2">
          <button class="btn g" onclick="playSfx('pop');clr()">🗑️ Hapus</button>
          <button class="btn" onclick="cek()">✅ Selesai</button>
        </div>` : ''}
      <div class="opts">
        ${(q.opts || []).map((o, j) => `<button class="opt ${o.cls || ''}" data-j="${j}" onclick="jawab(${j})">${o.h}</button>`).join('')}
      </div>
    </div>`;

  if (q.trace) setupCanvas(q.trace, q.isArab);
  setTimeout(() => saySeq(q.sayIds), 220);
}

function jawab(j) {
  const q = S.qs[S.i];
  const b = document.querySelector(`.opt[data-j="${j}"]`);
  if (S.lock || b.classList.contains('good')) return;

  if (String(q.opts[j].v) === String(q.ans)) {
    playSfx('win');
    b.classList.add('good');
    burst(b);
    if (S.first) S.ok++;
    S.lock = true;
    sayThen(['benar', ...q.winIds], adv);
  } else {
    playSfx('wrong');
    S.first = false;
    b.classList.add('bad');
    saySeq(['coba_lagi']);
    setTimeout(() => b.classList.remove('bad'), 420);
  }
}

/* ====== LOGIKA MENEBALKAN HURUF, ANGKA, & HIJAIYAH ====== */
let CV = null;
function setupCanvas(ch, isArab = false) {
  const c = $('#cv'), x = c.getContext('2d');
  const mk = () => { const k = document.createElement('canvas'); k.width = k.height = 320; return k; };
  const ink = mk(), msk = mk(), ix = ink.getContext('2d'), mx = msk.getContext('2d');
  const F = isArab
    ? '700 220px "Noto Naskh Arabic","Traditional Arabic",serif'
    : '700 270px Fredoka,"Comic Sans MS",system-ui,sans-serif';
  const yPos = isArab ? 168 : 172;
  const txt = (g, m) => { g.font = F; g.textAlign = 'center'; g.textBaseline = 'middle'; g[m + 'Text'](ch, 160, yPos); };
  mx.fillStyle = '#000';
  txt(mx, 'fill');

  CV = { c, x, ix, ink, msk, mx, ch, drawing: false, last: null, done: false };
  CV.guide = () => {
    x.clearRect(0, 0, 320, 320);
    x.fillStyle = 'rgba(130,130,170,.24)';
    txt(x, 'fill');
    x.setLineDash([10, 10]);
    x.lineWidth = 4;
    x.strokeStyle = '#8a86b5';
    txt(x, 'stroke');
    x.setLineDash([]);
  };
  CV.guide();

  const pt = e => {
    const r = c.getBoundingClientRect();
    return [(e.clientX - r.left) * 320 / r.width, (e.clientY - r.top) * 320 / r.height];
  };
  const seg = (a, b) => {
    [[x, '#ff6b6b'], [ix, '#000']].forEach(([g, col]) => {
      g.strokeStyle = col;
      g.lineWidth = 26;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.beginPath();
      g.moveTo(a[0], a[1]);
      g.lineTo(b[0] + 0.01, b[1]);
      g.stroke();
    });
  };

  c.onpointerdown = e => {
    if (CV.done) return;
    CV.drawing = true;
    CV.last = pt(e);
    c.setPointerCapture(e.pointerId);
    seg(CV.last, CV.last);
    e.preventDefault();
  };
  c.onpointermove = e => {
    if (!CV.drawing) return;
    const p = pt(e);
    seg(CV.last, p);
    CV.last = p;
  };
  c.onpointerup = c.onpointercancel = () => { CV.drawing = false; };
}

function clr() {
  if (!CV) return;
  CV.guide();
  CV.ix.clearRect(0, 0, 320, 320);
}

function cek() {
  if (!CV || CV.done) return;
  const m = CV.mx.getImageData(0, 0, 320, 320).data;
  const d = CV.ix.getImageData(0, 0, 320, 320).data;
  let M = 0, I = 0, O = 0;
  for (let k = 3; k < m.length; k += 4) {
    const a = m[k] > 128, b = d[k] > 128;
    if (a) M++;
    if (b) I++;
    if (a && b) O++;
  }
  const q = S.qs[S.i];
  if (I > 0 && O / M >= 0.42 && O / I >= 0.50) {
    playSfx('win');
    CV.done = true;
    if (S.first) S.ok++;
    burst($('#cv'));
    sayThen(q.winIds, adv);
  } else {
    playSfx('wrong');
    S.first = false;
    saySeq([I === 0 ? 'tebalkan_dulu' : 'hampir_pas']);
    clr();
  }
}

/* ====== EFEK PARTIKEL BINTANG ====== */
function burst(el) {
  const r = el.getBoundingClientRect();
  const E = ['⭐', '✨', '🎉', '💛', '🌟', '🎈'];
  for (let k = 0; k < 14; k++) {
    const f = document.createElement('div');
    f.className = 'fx';
    f.textContent = pick(E);
    f.style.left = (r.left + r.width / 2) + 'px';
    f.style.top = (r.top + r.height / 2) + 'px';
    f.style.setProperty('--x', (rnd(280) - 140) + 'px');
    f.style.setProperty('--y', (-70 - rnd(190)) + 'px');
    f.style.setProperty('--r', (rnd(360) - 180) + 'deg');
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1300);
  }
}

/* ====== LAYAR AKHIR ====== */
function fin() {
  playSfx('fanfare');
  const n = S.qs.length;
  const st = S.ok >= n - 1 ? 3 : S.ok >= n / 2 ? 2 : 1;
  $('#app').innerHTML = `
    <div class="end">
      <div class="mascot-wrap">${owlSVG('happy')}</div>
      <div class="stars">${'<span>⭐</span>'.repeat(st)}</div>
      <h1>Hebat! 🎉</h1>
      <p style="font-size:18px;margin:8px 0 18px">Kamu menjawab <b>${S.ok}</b> dari <b>${n}</b> soal dengan benar!</p>
      <button class="btn" onclick="start(${S.t})">🔄 Main Lagi</button>
      <button class="btn g" onclick="playSfx('pop');home()">🏠 Menu Utama</button>
    </div>`;
  saySeq(['hebat_selesai']);
  burst($('.stars'));
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

home();
